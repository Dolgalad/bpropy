[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpropy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "matplotlib",
  "mip",
  "pandas",
  "progress",
  "tensorboard",
]

[project.scripts]
bpropy-park-test = "bpropy.cli.test_park:main"
bpropy-datasets = "bpropy.cli.datasets:main"
bpropy-train = "bpropy.cli.train:main"
bpropy-test = "bpropy.cli.test:main"
bpropy-test-nair = "bpropy.cli.test_nair:main"
bpropy-diffusion-train = "bpropy.cli.diffusion:main"
bpropy-diffusion-test = "bpropy.cli.diffusion.test:main"
bpropy-flow-train = "bpropy.cli.flow:main"
bpropy-flow-test = "bpropy.cli.flow.test:main"
bpropy-ablation-inference-freq-max-iter = "bpropy.cli.ablation.inference_freq_max_iter_ablation:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpropy = [
    "vendor/scg3/scg3",
]

[project.optional-dependencies]
dev = [
]

test = [
]

docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]
