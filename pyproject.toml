[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpropy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "networkx",
  "matplotlib",
  "mip",
  "pandas",
  "progress",
  "tensorboard",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bpropy = [
    "vendor/scg3/scg3",
]

[project.optional-dependencies]
dev = [
]

test = [
]

docs = [
  "mkdocs-material",
  "mkdocstrings[python]",
]
