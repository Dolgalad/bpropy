name: Inference core (pure PyTorch)

on:
  pull_request:
  push:
    branches: [main, refactor/inference-core]

permissions:
  contents: read

jobs:
  inference:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch (no PyG or torch-scatter)
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2'
      - name: Compile inference sources
        run: python -m compileall -q src/bpropy/inference tests/inference benchmarks/inference_core.py examples/inference_quickstart.py
      - name: Verify inference independently of legacy experiments
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/inference -v
      - name: Execute differentiable example
        env:
          PYTHONPATH: src
        run: python examples/inference_quickstart.py
      - name: Exercise reproducible CPU benchmark (including backward + export)
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/inference_core.py --device cpu --variables 6 --factors 8 --iterations 3 --repeats 1 --warmup 1 --json-out /tmp/inference-ci.json --csv-out /tmp/inference-ci.csv > /dev/null
          test -s /tmp/inference-ci.json && test -s /tmp/inference-ci.csv

  pyg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch and optional PyG
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install torch-geometric
      - name: Run PyG roundtrip/batching tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests/inference -v
