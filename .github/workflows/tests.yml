name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: >
            pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', 'pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Upgrade pip
        run: |
          python -m pip install -U pip
      # Install torch + PyG stack FIRST (core deps)
      - name: Install torch + PyG (CPU) via script
        run: |
          chmod +x tools/install_pyg.sh
          CUDA=cpu TORCH_VERSION=2.8.0 bash tools/install_pyg.sh

      - name: Install bpropy
        run: |
          pip install -e .[test]

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests/unit -v

