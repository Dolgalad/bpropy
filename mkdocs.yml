site_name: bpropy
site_url: https://dolgalad.github.io/bpropy.git
repo_url: https://github.com/dolgalad/bpropy.git
theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: numpy
            merge_init_into_class: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - API:
    - Overview: api/index.md
    - bpropy: api/bpropy.md
    - CO: api/co.md

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
extra_css:
  - stylesheets/extra.css
